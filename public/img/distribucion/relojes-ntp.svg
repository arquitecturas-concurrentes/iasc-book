<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Intercambio de marcas de tiempo en NTP</title>
  <desc id="desc">Cliente y servidor intercambian cuatro mensajes. Las marcas t1 a t4 permiten estimar el offset y el retardo de red, bajo supuestos sobre la simetría de las demoras.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="900" height="360" rx="18" fill="#fff"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Estimación de tiempo: intercambio NTP</text>
  <text x="205" y="90" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172b4d">Cliente</text>
  <text x="695" y="90" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#172b4d">Servidor</text>
  <line x1="205" y1="110" x2="205" y2="310" stroke="#90a4ae" stroke-width="3"/>
  <line x1="695" y1="110" x2="695" y2="310" stroke="#90a4ae" stroke-width="3"/>
  <text x="178" y="137" text-anchor="end" font-family="sans-serif" font-size="17" fill="#263238">t1</text>
  <circle cx="205" cy="132" r="6" fill="#1565c0"/>
  <line x1="218" y1="132" x2="680" y2="187" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="450" y="144" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1565c0">solicitud</text>
  <text x="722" y="198" font-family="sans-serif" font-size="17" fill="#263238">t2</text>
  <circle cx="695" cy="193" r="6" fill="#ef6c00"/>
  <text x="722" y="231" font-family="sans-serif" font-size="17" fill="#263238">t3</text>
  <circle cx="695" cy="226" r="6" fill="#ef6c00"/>
  <line x1="682" y1="226" x2="220" y2="281" stroke="#ef6c00" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ef6c00">respuesta</text>
  <text x="178" y="302" text-anchor="end" font-family="sans-serif" font-size="17" fill="#263238">t4</text>
  <circle cx="205" cy="297" r="6" fill="#1565c0"/>
  <text x="450" y="334" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#455a64">El offset se estima suponiendo demoras aproximadamente simétricas; la red introduce incertidumbre.</text>
</svg>
