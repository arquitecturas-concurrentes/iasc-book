<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Causalidad y relojes vectoriales</title>
  <desc id="desc">Dos nodos registran eventos locales concurrentes; un mensaje de A a B lleva un vector que permite a B registrar la precedencia causal de los eventos.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#263238"/>
    </marker>
    <marker id="message" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="900" height="390" rx="18" fill="#fff"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Orden causal, no hora física</text>
  <text x="145" y="105" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#172b4d">Nodo A</text>
  <text x="755" y="105" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#172b4d">Nodo B</text>
  <line x1="145" y1="125" x2="145" y2="330" stroke="#90a4ae" stroke-width="3"/>
  <line x1="755" y1="125" x2="755" y2="330" stroke="#90a4ae" stroke-width="3"/>
  <line x1="145" y1="145" x2="145" y2="310" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="755" y1="145" x2="755" y2="310" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="145" cy="175" r="9" fill="#00897b"/>
  <text x="172" y="180" font-family="sans-serif" font-size="16" fill="#263238">a: [1,0]</text>
  <circle cx="755" cy="205" r="9" fill="#ef6c00"/>
  <text x="728" y="210" text-anchor="end" font-family="sans-serif" font-size="16" fill="#263238">b: [0,1]</text>
  <text x="450" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#455a64">a y b son concurrentes</text>
  <line x1="160" y1="175" x2="738" y2="275" stroke="#1565c0" stroke-width="3" marker-end="url(#message)"/>
  <text x="450" y="232" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1565c0">mensaje que contiene [1,0]</text>
  <circle cx="755" cy="275" r="9" fill="#ef6c00"/>
  <text x="728" y="281" text-anchor="end" font-family="sans-serif" font-size="16" fill="#263238">c: [1,2]</text>
  <text x="450" y="352" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#455a64">Al recibir el mensaje, B incorpora la historia causal de A antes de c.</text>
</svg>
