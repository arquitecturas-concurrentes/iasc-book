<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Entrega de una difusión en distintos momentos</title>
  <desc id="desc">El proceso A difunde m1 a B y C. B recibe su copia antes que C debido a diferentes demoras de red.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#263238"/>
    </marker>
  </defs>
  <rect width="900" height="390" rx="18" fill="#fff"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172b4d">Una difusión, distintas demoras de entrega</text>
  <g font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#172b4d">
    <text x="180" y="95">Proceso A</text>
    <text x="475" y="95">Proceso B</text>
    <text x="755" y="95">Proceso C</text>
  </g>
  <g stroke="#90a4ae" stroke-width="2">
    <line x1="180" y1="112" x2="180" y2="330"/>
    <line x1="475" y1="112" x2="475" y2="330"/>
    <line x1="755" y1="112" x2="755" y2="330"/>
  </g>
  <circle cx="180" cy="145" r="8" fill="#1565c0"/>
  <text x="150" y="151" text-anchor="end" font-family="sans-serif" font-size="16" fill="#1565c0">difunde m1</text>
  <path d="M190 145 C285 155, 380 175, 463 190" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="330" y="165" text-anchor="middle" font-family="sans-serif" font-size="17" font-style="italic" fill="#263238">m1</text>
  <circle cx="475" cy="193" r="7" fill="#00897b"/>
  <text x="500" y="199" font-family="sans-serif" font-size="15" fill="#00897b">entrega primero</text>
  <path d="M190 151 C340 185, 515 230, 743 270" fill="none" stroke="#ef6c00" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="555" y="222" text-anchor="middle" font-family="sans-serif" font-size="17" font-style="italic" fill="#263238">m1</text>
  <circle cx="755" cy="272" r="7" fill="#ef6c00"/>
  <text x="780" y="278" font-family="sans-serif" font-size="15" fill="#ef6c00">entrega después</text>
  <text x="450" y="360" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#455a64">El orden de llegada puede diferir sin que se haya perdido el mensaje.</text>
</svg>
