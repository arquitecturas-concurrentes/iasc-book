<svg baseProfile="full" height="720px" version="1.1" viewBox="0 0 1240 720" width="1240px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="720" width="1240" x="0" y="0" /><rect fill="#176D82" height="7" width="1240" x="0" y="0" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="44" y="49">Una entrada se replica y se confirma por mayoría</text><text fill="#607482" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="44" y="79">El líder cuenta su propia copia y dos respuestas duraderas de seguidores.</text><rect fill="#E7F1F5" height="38" rx="8" ry="8" stroke="#D5E0E5" stroke-width="1.6" width="152" x="19" y="114" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="95" y="139">Cliente</text><line stroke="#C8D7DD" stroke-dasharray="5 6" stroke-width="1.4" x1="95" x2="95" y1="151" y2="655" /><rect fill="#E7F1F5" height="38" rx="8" ry="8" stroke="#D5E0E5" stroke-width="1.6" width="152" x="274" y="114" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="350" y="139">Líder A</text><line stroke="#C8D7DD" stroke-dasharray="5 6" stroke-width="1.4" x1="350" x2="350" y1="151" y2="655" /><rect fill="#E7F1F5" height="38" rx="8" ry="8" stroke="#D5E0E5" stroke-width="1.6" width="152" x="564" y="114" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="640" y="139">B</text><line stroke="#C8D7DD" stroke-dasharray="5 6" stroke-width="1.4" x1="640" x2="640" y1="151" y2="655" /><rect fill="#E7F1F5" height="38" rx="8" ry="8" stroke="#D5E0E5" stroke-width=