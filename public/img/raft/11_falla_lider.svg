<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="510px" version="1.1" viewBox="0 0 1210 510" width="1210px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="510" width="1210" x="0" y="0" /><rect fill="#176D82" height="7" width="1210" x="0" y="0" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="44" y="49">Una entrada pendiente puede cambiar; una confirmada no</text><text fill="#607482" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="44" y="79">La confirmación, no la mera escritura local, marca la diferencia.</text><rect fill="#FCF3E7" height="235" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="527" x="44" y="136" /><rect fill="#A96B25" height="235" rx="3" width="7" x="44" y="136" /><text fill="#A96B25" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="66" y="167">Antes de confirmar</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="66" y="200">T7, índice 4: comando X.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="66" y="225">Solo A y B almacenan X.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="66" y="250">A falla sin mayoría.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="66" y="275">Nuevo líder puede reemplazar X.</text><rect fill="#E8F5EF" height="235" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="527" x="633" y="136" /><rect fill="#277A65" height="235" rx="3" width="7" x="633" y="136" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="655" y="167">Después de confirmar</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="655" y="200">T7, índice 3: comando Y.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="655" y="225">A, B y C almacenaron Y.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="655" y="250">A falla después de confirmarla.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="655" y="275">Todo líder posterior conserva Y.</text><rect fill="#EDF4F6" height="31" rx="8" ry="8" stroke="#EDF4F6" stroke-width="0" width="306" x="150" y="394" /><text fill="#A96B25" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="303.0" y="415">X: pendiente, reemplazable</text><rect fill="#EDF4F6" height="31" rx="8" ry="8" stroke="#EDF4F6" stroke-width="0" width="304" x="742" y="394" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="894.0" y="415">Y: confirmada, perdurable</text><text fill="#687E8C" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="44" y="470">El registro del seguidor puede repararse; una entrada aplicada no puede sustituirse.</text></svg>