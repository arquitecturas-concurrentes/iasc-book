<svg baseProfile="full" height="490px" version="1.1" viewBox="0 0 1180 490" width="1180px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="490" width="1180" x="0" y="0" /><rect fill="#176D82" height="7" width="1180" x="0" y="0" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="44" y="49">Estados de un servidor votante</text><text fill="#607482" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="44" y="79">El término creciente evita que una autoridad antigua conserve vigencia.</text><rect fill="#E7F1F5" height="111" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="279" x="60" y="162" /><rect fill="#176D82" height="111" rx="3" width="7" x="60" y="162" /><text fill="#176D82" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="82" y="193">Seguidor</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="82" y="226">Espera líder o concede votos.</text><rect fill="#FCF3E7" height="111" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="279" x="451" y="162" /><rect fill="#A96B25" height="111" rx="3" width="7" x="451" y="162" /><text fill="#A96B25" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="473" y="193">Candidato</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="473" y="226">Solicita votos de mayoría.</text><rect fill="#E8F5EF" height="111" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="279" x="845" y="162" /><rect fill="#277A65" height="111" rx="3" width="7" x="845" y="162" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="867" y="193">Líder</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="867" y="226">Replica entradas y mantiene latidos.</text><line stroke="#A96B25" stroke-width="2.3" x1="342" x2="443" y1="201" y2="201" /><polygon fill="#A96B25" points="443,201 432.0,196.0 432.0,206.0" /><text fill="#A96B25" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="392.5" y="191.0">timeout</text><line stroke="#277A65" stroke-width="2.3" x1="734" x2="837" y1="201" y2="201" /><polygon fill="#277A65" points="837,201 826.0,196.0 826.0,206.0" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="785.5" y="191.0">mayoría</text><line stroke="#A9484D" stroke-width="2.3" x1="981" x2="225" y1="285" y2="322" /><polygon fill="#A9484D" points="225,322 236.23126591609673,326.45630630925706 235.74243302714768,316.46826133505505" /><text fill="#A9484D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="603.0" y="291.5">término superior</text><line stroke="#A9484D" stroke-width="2.3" x1="581" x2="225" y1="283" y2="302" /><polygon fill="#A9484D" points="225,302 236.2508416484935,306.40664977057673 235.7178922809508,296.42086162082927" /><text fill="#687E8C" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="44" y="451">Una elección puede terminar sin líder: el candidato reintenta en un término más alto.</text></svg>