<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="525px" version="1.1" viewBox="0 0 1190 525" width="1190px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="525" width="1190" x="0" y="0" /><rect fill="#176D82" height="7" width="1190" x="0" y="0" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="44" y="49">Confirmación: las entradas antiguas exigen cuidado</text><text fill="#607482" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="44" y="79">Un líder confirma directamente una entrada de su término actual cuando alcanza mayoría.</text><rect fill="#FCF3E7" height="208" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="518" x="48" y="139" /><rect fill="#A96B25" height="208" rx="3" width="7" x="48" y="139" /><text fill="#A96B25" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="70" y="170">Entrada del término anterior</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="70" y="203">Líder actual: t = 8.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="70" y="228">Entrada índice 5: término 7.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="70" y="253">Hay tres copias de cinco.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="70" y="278">No alcanza para confirmar directamente.</text><rect fill="#E8F5EF" height="208" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="518" x="626" y="139" /><rect fill="#277A65" height="208" rx="3" width="7" x="626" y="139" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="648" y="170">Entrada nueva del término 8</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="648" y="203">Líder añade índice 6: término 8.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="648" y="228">Tres copias almacenadas.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="648" y="253">El líder confirma la entrada 6.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="648" y="278">El prefijo anterior queda confirmado.</text><line stroke="#607482" stroke-width="2.3" x1="569" x2="620" y1="243" y2="243" /><polygon fill="#607482" points="620,243 609.0,238.0 609.0,248.0" /><rect fill="#E7F1F5" height="83" rx="13" ry="13" stroke="#B7D0D8" stroke-width="1.6" width="761" x="216" y="373" /><text fill="#176D82" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="597" y="405">Regla: mayoría y log[N].term = currentTerm</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="597" y="435">No declarar definitivo un índice antiguo solo por el número de copias.</text><text fill="#687E8C" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="44" y="499">La regla completa evita falsos compromisos durante cambios de liderazgo.</text></svg>