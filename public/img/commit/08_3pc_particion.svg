<svg baseProfile="full" height="610px" version="1.1" viewBox="0 0 1230 610" width="1230px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="610" width="1230" x="0" y="0" /><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="33" y="45">3PC · riesgo de partición: dos observaciones incompatibles</text><line stroke="#117985" stroke-width="3" x1="33" x2="1190" y1="62" y2="62" /><rect fill="#eaf5f5" height="360" rx="17" stroke="#b3cbd6" stroke-width="2" width="550" x="35" y="115" /><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="310" y="166">COMPONENTE A</text><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="310" y="230">P1 recibió PRE-COMMIT</text><text fill="#117985" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="310" y="300">La recuperación termina en COMMIT</text><rect fill="#117985" height="65" rx="13" width="230" x="195" y="347" /><text fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="310" y="388">COMMIT</text><rect fill="#fff0f0" height="360" rx="17" stroke="#b3cbd6" stroke-width="2" width="550" x="655" y="115" /><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="930" y="166">COMPONENTE B</text><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" x="930" y="230">P2 permanece WAIT</text><text fill="#c24b4c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="930" y="300">Un timeout puede causar ABORT</text><rect fill="#c24b4c" height="65" rx="13" width="230" x="815" y="347" /><text fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="930" y="388">ABORT</text><rect fill="#dddddd" height="222" rx="8" width="28" x="600" y="195" /><text fill="#c24b4c" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="614" y="180">X</text><text fill="#c24b4c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="615" y="540">La partición invalida la interpretación fiable de los timeouts y puede comprometer atomicidad.</text></svg>