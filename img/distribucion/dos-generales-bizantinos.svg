<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">Dos generales y generales bizantinos</title>
  <desc id="description">Arriba, dos generales intercambian una orden y acuses de recibo, pero el último acuse puede perderse. Abajo, un comandante traidor envía órdenes contradictorias a dos generales leales.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b4d; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.2px; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#526581"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c45235"/>
    </marker>
  </defs>
  <rect width="1000" height="760" rx="24" fill="#f7f9fc"/>

  <text x="54" y="52" class="eyebrow" fill="#526581">1 · DOS GENERALES: MENSAJES QUE PUEDEN PERDERSE</text>
  <rect x="64" y="78" width="872" height="286" rx="18" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
  <text x="112" y="122" class="heading">General A</text>
  <text x="752" y="122" class="heading">General B</text>
  <circle cx="158" cy="158" r="20" fill="#d9e8ff" stroke="#5476a5" stroke-width="2"/>
  <circle cx="842" cy="158" r="20" fill="#d9e8ff" stroke="#5476a5" stroke-width="2"/>
  <path d="M188 157 H808" stroke="#526581" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="395" y="137" width="212" height="38" rx="19" fill="#eef3f8"/>
  <text x="501" y="162" text-anchor="middle" class="small">1. «Ataquemos»</text>

  <path d="M812 211 H192" stroke="#526581" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="380" y="191" width="242" height="38" rx="19" fill="#eef3f8"/>
  <text x="501" y="216" text-anchor="middle" class="small">2. «Recibí la orden»</text>

  <path d="M188 265 H808" stroke="#c45235" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/>
  <path d="M485 249 L517 281 M517 249 L485 281" stroke="#c45235" stroke-width="5" stroke-linecap="round"/>
  <text x="501" y="307" text-anchor="middle" class="small" fill="#a33b1c">3. «¿Recibiste mi acuse?» — puede perderse</text>
  <text x="500" y="341" text-anchor="middle" class="small" fill="#526581">Cada acuse deja al emisor con una nueva duda sobre su recepción.</text>

  <text x="54" y="421" class="eyebrow" fill="#526581">2 · GENERALES BIZANTINOS: PARTICIPANTES QUE PUEDEN MENTIR</text>
  <rect x="64" y="447" width="872" height="266" rx="18" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>

  <rect x="378" y="482" width="244" height="68" rx="14" fill="#fff0e8" stroke="#e4a181" stroke-width="2"/>
  <text x="500" y="510" text-anchor="middle" class="heading">Comandante</text>
  <text x="500" y="534" text-anchor="middle" class="small" fill="#a33b1c">traidor: equivoca los mensajes</text>

  <rect x="103" y="617" width="240" height="64" rx="14" fill="#eaf4f3" stroke="#9ccfc8" stroke-width="2"/>
  <text x="223" y="645" text-anchor="middle" class="heading">General leal A</text>
  <text x="223" y="667" text-anchor="middle" class="small">recibe «Atacar»</text>

  <rect x="657" y="617" width="240" height="64" rx="14" fill="#eaf4f3" stroke="#9ccfc8" stroke-width="2"/>
  <text x="777" y="645" text-anchor="middle" class="heading">General leal B</text>
  <text x="777" y="667" text-anchor="middle" class="small">recibe «Retirarse»</text>

  <path d="M420 551 L278 608" stroke="#c45235" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="282" y="560" width="118" height="32" rx="16" fill="#fff0e8"/>
  <text x="341" y="581" text-anchor="middle" class="small" fill="#a33b1c">«Atacar»</text>

  <path d="M580 551 L722 608" stroke="#c45235" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="600" y="560" width="134" height="32" rx="16" fill="#fff0e8"/>
  <text x="667" y="581" text-anchor="middle" class="small" fill="#a33b1c">«Retirarse»</text>

  <text x="500" y="699" text-anchor="middle" class="small" fill="#526581">Los leales necesitan acordar una decisión pese a los mensajes contradictorios.</text>
</svg>
