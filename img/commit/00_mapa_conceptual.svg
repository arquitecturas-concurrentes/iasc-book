<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 1280 480" width="1280px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="480" width="1280" x="0" y="0" /><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" x="32" y="45">Tres conceptos relacionados, pero no equivalentes</text><line stroke="#117985" stroke-width="3" x1="32" x2="1248" y1="65" y2="65" /><rect fill="#eaf1fa" height="230" rx="16" stroke="#b5c8d5" stroke-width="1.4" width="385" x="35" y="115" /><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="227" y="167">CONSENSO</text><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="227" y="227">Acordar un valor</text><text fill="#117985" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="227" y="290">Paxos / Raft</text><rect fill="#eaf5f5" height="230" rx="16" stroke="#b5c8d5" stroke-width="1.4" width="385" x="445" y="115" /><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="637" y="167">VOTACIÓN</text><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="637" y="227">Expresar disposición local</text><text fill="#117985" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="637" y="290">YES / NO</text><rect fill="#eaf1fa" height="230" rx="16" stroke="#b5c8d5" stroke-width="1.4" width="385" x="855" y="115" /><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="1047" y="167">COMMIT ATÓMICO</text><text fill="#14243a" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="1047" y="227">Decidir todo o nada</text><text fill="#117985" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1047" y="290">2PC / 3PC</text><text fill="#c24b4c" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="640" y="398">Un voto YES = disposición a confirmar, no una decisión COMMIT.</text><text fill="#65778a" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="640" y="438">La regla de commit requiere unanimidad de los participantes relevantes.</text></svg>