  <text fill="#65778a" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="226" y="365">Prepara una reserva provisional</text>
  <rect fill="#e4f2ef" height="39" rx="16" ry="16" stroke="#bdded6" stroke-width="1" width="142" x="155" y="384"/>
  <text fill="#166b54" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="226" y="409">Voto: YES / NO</text>
  <rect fill="#f7fafc" height="178" rx="12" ry="12" stroke="#b5c8d5" stroke-width="1.5" width="372" x="454" y="263"/>
  <text fill="#14243a" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="640" y="296">Inscripciones</text>
