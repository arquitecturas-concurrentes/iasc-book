<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="570px" version="1.1" viewBox="0 0 1280 570" width="1280px">
  <title>Inscripción a seminario con tres participantes transaccionales</title>
  <desc>Un coordinador pregunta a los servicios de cupos, inscripciones y agenda. Si los tres votan afirmativamente la confirmación es posible; si uno rechaza se aborta toda la transacción.</desc>
  <defs/>
  <rect fill="#fff" height="570" width="1280" x="0" y="0"/>
  <text fill="#14243a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="start" x="34" y="44">Caso de estudio: una inscripción distribuida</text>
  <line stroke="#117985" stroke-width="3" x1="34" x2="1246" y1="61" y2="61"/>
  <rect fill="#eaf1fa" height="102" rx="12" ry="12" stroke="#b5c8d5" stroke-width="1.5" width="440" x="420" y="91"/>
  <text fill="#14243a" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" x="640" y="129">Coordinador de la transacción</text>
  <text fill="#65778a" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="640" y="163">T-1042  ·  PREPARE → DECISIÓN GLOBAL</text>
  <line stroke="#117985" stroke-width="3" x1="640" x2="640" y1="193" y2="219"/>
  <line stroke="#117985" stroke-width="3" x1="226" x2="1054" y1="219" y2="219"/>
