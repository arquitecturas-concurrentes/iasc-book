  <polygon fill="#117985" points="633,239 647,239 640,251"/>
  <line stroke="#117985" stroke-width="3" x1="1054" x2="1054" y1="219" y2="247"/>
  <polygon fill="#117985" points="1047,239 1061,239 1054,251"/>
  <rect fill="#f7fafc" height="178" rx="12" ry="12" stroke="#b5c8d5" stroke-width="1.5" width="372" x="40" y="263"/>
  <text fill="#14243a" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="226" y="296">Cupos</text>
