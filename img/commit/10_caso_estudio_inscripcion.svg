  <text fill="#65778a" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="640" y="365">Prepara la nueva inscripción</text>
  <rect fill="#e4f2ef" height="39" rx="16" ry="16" stroke="#bdded6" stroke-width="1" width="142" x="569" y="384"/>
  <text fill="#166b54" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="640" y="409">Voto: YES / NO</text>
