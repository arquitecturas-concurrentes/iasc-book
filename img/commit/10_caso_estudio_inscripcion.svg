  <text fill="#65778a" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="middle" x="1054" y="365">Prepara la incorporación del turno</text>
  <rect fill="#e4f2ef" height="39" rx="16" ry="16" stroke="#bdded6" stroke-width="1" width="142" x="983" y="384"/>
  <text fill="#166b54" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="1054" y="409">Voto: YES / NO</text>
  <text fill="#14243a" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="640" y="475">Regla de confirmación: los tres participantes lógicos deben estar preparados</text>
  <rect fill="#e5f4ef" height="58" rx="10" ry="10" stroke="#b4d6c5" stroke-width="1.5" width="568" x="48" y="492"/>
  <text fill="#166b54" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="332" y="527">YES + YES + YES  →  COMMIT</text>
  <rect fill="#fae8e9" height="58" rx="10" ry="10" stroke="#e1bdc0" stroke-width="1.5" width="568" x="664" y="492"/>
  <text fill="#b7444b" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="948" y="527">YES + YES + NO  →  ABORT</text>
