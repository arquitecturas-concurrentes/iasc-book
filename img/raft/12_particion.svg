<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 1160 480" width="1160px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="480" width="1160" x="0" y="0" /><rect fill="#176D82" height="7" width="1160" x="0" y="0" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="44" y="49">Partición de cinco servidores: grupo de tres frente a grupo de dos</text><text fill="#607482" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="44" y="79">La mayoría puede elegir y confirmar; la minoría no puede producir decisiones rivales.</text><rect fill="#E8F5EF" height="223" rx="26" ry="26" stroke="#9DCCB6" stroke-width="1.6" width="635" x="50" y="137" /><rect fill="#FCEDEF" height="223" rx="26" ry="26" stroke="#E3B4B7" stroke-width="1.6" width="369" x="747" y="137" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" x="81" y="174">Componente mayoritaria</text><text fill="#A9484D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start" x="778" y="174">Componente minoritaria</text><circle cx="189" cy="260" fill="#FFFFFF" r="35" stroke="#277A65" stroke-width="3" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="189" y="266">A</text><circle cx="354" cy="260" fill="#FFFFFF" r="35" stroke="#277A65" stroke-width="3" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="354" y="266">B</text><circle cx="519" cy="260" fill="#FFFFFF" r="35" stroke="#277A65" stroke-width="3" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="519" y="266">C</text><circle cx="847" cy="260" fill="#FFFFFF" r="35" stroke="#A9484D" stroke-width="3" /><text fill="#A9484D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="847" y="266">D</text><circle cx="1015" cy="260" fill="#FFFFFF" r="35" stroke="#A9484D" stroke-width="3" /><text fill="#A9484D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1015" y="266">E</text><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="369" y="327">3 de 5: puede avanzar</text><text fill="#A9484D" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="930" y="327">2 de 5: debe esperar</text><text fill="#687E8C" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="44" y="444">Sin mayoría no se confirma una operación nueva aunque existan réplicas accesibles.</text></svg>