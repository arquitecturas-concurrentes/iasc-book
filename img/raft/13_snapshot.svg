<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="510px" version="1.1" viewBox="0 0 1200 510" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="510" width="1200" x="0" y="0" /><rect fill="#176D82" height="7" width="1200" x="0" y="0" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="44" y="49">Instantáneas: recuperar estado sin reenviar todo el registro</text><text fill="#607482" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="44" y="79">Una snapshot conserva estado aplicado y la posición de su último comando incluido.</text><rect fill="#E7F1F5" height="196" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="309" x="55" y="147" /><rect fill="#176D82" height="196" rx="3" width="7" x="55" y="147" /><text fill="#176D82" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="77" y="178">Registro extenso</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="77" y="211">Índices 1 ... 50: aplicados</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="77" y="236">Índices 51 ... 70: posteriores</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="77" y="261">El prefijo ocupa espacio.</text><rect fill="#E8F5EF" height="196" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="315" x="440" y="147" /><rect fill="#277A65" height="196" rx="3" width="7" x="440" y="147" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="462" y="178">Snapshot al índice 50</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="462" y="211">Estado de la máquina</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="462" y="236">lastIncludedIndex = 50</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="462" y="261">lastIncludedTerm = 12</text><rect fill="#FCF3E7" height="196" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="320" x="830" y="147" /><rect fill="#A96B25" height="196" rx="3" width="7" x="830" y="147" /><text fill="#A96B25" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="852" y="178">Seguidor rezagado</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="852" y="211">Recibe InstallSnapshot.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="852" y="236">Instala el estado hasta 50.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="852" y="261">Continúa desde el sufijo.</text><line stroke="#176D82" stroke-width="2.3" x1="368" x2="432" y1="246" y2="246" /><polygon fill="#176D82" points="432,246 421.0,241.0 421.0,251.0" /><line stroke="#277A65" stroke-width="2.3" x1="759" x2="822" y1="246" y2="246" /><polygon fill="#277A65" points="822,246 811.0,241.0 811.0,251.0" /><text fill="#687E8C" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="44" y="466">La instantánea no autoriza a perder el metadato de índice y término del prefijo.</text></svg>