<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 1260 500" width="1260px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="500" width="1260" x="0" y="0" /><rect fill="#176D82" height="7" width="1260" x="0" y="0" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" x="44" y="49">Reconfiguración segura con consenso conjunto</text><text fill="#607482" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="44" y="79">La etapa transitoria exige los quórums de la configuración anterior y la nueva.</text><rect fill="#E7F1F5" height="199" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="328" x="40" y="141" /><rect fill="#176D82" height="199" rx="3" width="7" x="40" y="141" /><text fill="#176D82" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="62" y="172">Configuración antigua</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="62" y="205">Conjunto de votantes C_ant.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="62" y="230">Quórum: mayoría de C_ant.</text><rect fill="#FCF3E7" height="199" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="328" x="469" y="141" /><rect fill="#A96B25" height="199" rx="3" width="7" x="469" y="141" /><text fill="#A96B25" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="491" y="172">Configuración conjunta</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="491" y="205">C_ant y C_nueva coexisten.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="491" y="230">Se requieren ambas mayorías.</text><rect fill="#E8F5EF" height="199" rx="15" ry="15" stroke="#D5E0E5" stroke-width="1.6" width="321" x="897" y="141" /><rect fill="#277A65" height="199" rx="3" width="7" x="897" y="141" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="919" y="172">Configuración nueva</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="919" y="205">Conjunto de votantes C_nueva.</text><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="919" y="230">Quórum: mayoría de C_nueva.</text><line stroke="#176D82" stroke-width="2.3" x1="375" x2="460" y1="237" y2="237" /><polygon fill="#176D82" points="460,237 449.0,232.0 449.0,242.0" /><text fill="#176D82" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="417.5" y="227.0">entrada conjunta</text><line stroke="#277A65" stroke-width="2.3" x1="804" x2="890" y1="237" y2="237" /><polygon fill="#277A65" points="890,237 879.0,232.0 879.0,242.0" /><text fill="#277A65" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="847.0" y="227.0">entrada final</text><rect fill="#F0F5F7" height="73" rx="13" ry="13" stroke="#D5E0E5" stroke-width="1.6" width="707" x="278" y="371" /><text fill="#17354B" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="633" y="399">Nunca cambiar por decreto externo qué mayoría vale.</text><text fill="#607482" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="633" y="426">La tesis describe también una variante de cambios de un servidor por vez.</text><text fill="#687E8C" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="44" y="476">La elección de variante debe ser coherente con toda la implementación.</text></svg>